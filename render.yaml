services:
  - type: web
    name: aura-api
    env: node
    region: oregon
    # free while pre-production (accepts spin-down + cold start, ~50s first request after idle).
    # Bump to `starter` for production launch — single instance is intentional either way (in-memory
    # turn-queue assumes one instance; see specs/v1-architecture.md §8), and free is single-instance too.
    plan: free
    rootDir: server
    buildCommand: pnpm --filter @aura/shared run build && pnpm install --include=dev && pnpm --filter @aura/server run build
    startCommand: pnpm --filter @aura/server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_FILE
        sync: false
      - key: APNS_ENVIRONMENT
        sync: false
      - key: BANNED_IDENTITY_PEPPER
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: INWORLD_API_KEY
        sync: false
      - key: INWORLD_VOICE_ID_AURORA
        sync: false
      - key: INWORLD_VOICE_ID_ORION
        sync: false
      - key: INWORLD_VOICE_ID_LYRA
        sync: false
      - key: INWORLD_VOICE_ID_SAGE
        sync: false
      - key: INWORLD_VOICE_ID_AMARA
        sync: false
      - key: INWORLD_VOICE_ID_ELI
        sync: false
      - key: INWORLD_VOICE_ID_SELENE
        sync: false
      - key: INWORLD_VOICE_ID_SOREN
        sync: false
      - key: INWORLD_VOICE_ID_JUNO
        sync: false
      - key: INWORLD_VOICE_ID_THEA
        sync: false
      - key: INWORLD_VOICE_ID_CYRUS
        sync: false
      - key: INWORLD_VOICE_ID_WREN
        sync: false
