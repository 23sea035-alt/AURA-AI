packages:
  - client
  - server
  - shared
  - tools

catalog:
  '@types/node': ^25.3.3
  drizzle-orm: ^0.45.2
  react: 19.1.0
  react-dom: 19.1.0
  tsx: ^4.21.0
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

allowBuilds:
  '@clerk/shared': true
  '@livekit/local-inference': true
  '@livekit/agents-plugin-silero': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@livekit/agents@1.4.11'
  - '@livekit/agents-plugin-cartesia@1.4.11'
  - '@livekit/agents-plugin-deepgram@1.4.11'
  - '@livekit/agents-plugin-silero@1.4.11'
